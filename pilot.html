<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Compflow Pilot Activation</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#070b14}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#18234a,transparent 40%),#070b14}.card{width:min(560px,100%);padding:32px;border:1px solid #25304a;border-radius:18px;background:#0d1424;box-shadow:0 20px 70px #0008}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc}.logo{font-size:24px;font-weight:800;margin:8px 0 22px}.logo span{color:#60a5fa}h1{font-size:30px;margin:0 0 8px}p{color:#aab5cc;line-height:1.55}.field{margin:18px 0}label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid #33415f;border-radius:10px;background:#090f1c;color:#fff;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#3b82f6;color:white;font-weight:700;font-size:15px;cursor:pointer}.hint{font-size:12px;color:#7f8ba3}.error{margin-top:14px;color:#fca5a5}.success{margin-top:14px;color:#86efac}.hidden{display:none}.security{margin-top:24px;padding:13px;border:1px solid #26334d;border-radius:10px;font-size:12px;color:#8fa0ba}
</style></head>
<body><main class="card"><div class="eyebrow">Private pilot program</div><div class="logo">Compflow<span>AI</span></div><h1>Activate your pilot</h1><p>This invitation is tied to the company email it was issued for. You can use the link or enter the invitation code manually.</p>
<form id="form"><div class="field"><label for="email">Company email</label><input id="email" type="email" autocomplete="email" required placeholder="you@company.com"></div><div class="field"><label for="name">Your name</label><input id="name" autocomplete="name" placeholder="Jane Smith"></div><div class="field"><label for="code">Pilot invitation code</label><input id="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required placeholder="CFP-XXXX-XXXX-XXXX-XXXX-XXXX"></div><button id="submit">Activate pilot</button></form>
<div id="message" class="hidden"></div><div class="security">Invitation codes are single-use, time-limited, tied to the invited email, and stored only as hashes after creation.</div></main>
<script>
const API='https://api.compflow.icu';
const params=new URLSearchParams(location.search);const supplied=params.get('code');if(supplied)document.getElementById('code').value=supplied.toUpperCase();if(supplied)history.replaceState({},document.title,location.pathname);
const form=document.getElementById('form'),button=document.getElementById('submit'),message=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();message.className='hidden';button.disabled=true;button.textContent='Activating…';try{const r=await fetch(API+'/api/pilot/redeem',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,name:document.getElementById('name').value,code:document.getElementById('code').value})});const data=await r.json();if(!r.ok)throw new Error(data.message||({PILOT_EMAIL_MISMATCH:'The email does not match the invited company email.',PILOT_INVITATION_UNAVAILABLE:'This invitation has expired, been revoked, or was already used.',PILOT_ACCOUNT_ALREADY_EXISTS:'This email already has a Compflow account. Please use the existing sign-in method.'}[data.error]||'Activation could not be completed.'));message.textContent='Pilot activated. Opening your Compflow workspace…';message.className='success';setTimeout(()=>location.href='app.html?auth=success',500)}catch(err){message.textContent=err.message;message.className='error'}finally{button.disabled=false;button.textContent='Activate pilot'}});
</script></body></html>
