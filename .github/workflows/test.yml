name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Full tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compflow_user
          POSTGRES_PASSWORD: compflow_pass
          POSTGRES_DB: compflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compflow_user -d compflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      AUTH_SECRET: ci-test-auth-secret
      DATABASE_URL: postgresql://compflow_user:compflow_pass@localhost:5432/compflow_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: compflow_test
      POSTGRES_USER: compflow_user
      POSTGRES_PASSWORD: compflow_pass
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify infrastructure
        run: |
          node -e "const net=require('net'); const c=net.createConnection(6379,'127.0.0.1'); c.on('connect',()=>{console.log('Redis reachable');c.destroy()}); c.on('error',e=>{console.error(e);process.exit(1)})"
          node -e "const net=require('net'); const c=net.createConnection(5432,'127.0.0.1'); c.on('connect',()=>{console.log('PostgreSQL reachable');c.destroy()}); c.on('error',e=>{console.error(e);process.exit(1)})"

      - name: Initialize PostgreSQL schema
        run: node --input-type=module -e "const { initDb } = await import('./core/db.js'); await initDb(); console.log('PostgreSQL schema initialized')"

      - name: Seed deterministic test principals
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const users = [
            ['usr_test123','test123@example.test'],
            ['usr_test456','test456@example.test'],
            ['usr_expired','expired@example.test'],
            ['usr_revoke','revoke@example.test'],
            ['usr_check','check@example.test'],
            ['usr_onboarding_test_99','onboarding99@example.test'],
            ['usr_hardened_test_01','hardened01@example.test'],
            ['usr_sec_1','sec1@example.test'],
            ['usr_test_123','test123b@example.test'],
            ['usr_1','user1@example.test'],
            ['usr_csrf_test','csrf@example.test'],
            ['usr_empty','empty@example.test'],
            ['usr_summary_lead','summarylead@example.test'],
            ['usr_cross_instance','crossinstance@example.test'],
            ['usr_rotate','rotate@example.test']
          ];
          const orgs = [
            ['org_acme','Acme Security'],
            ['org_1','Org 1'],
            ['org_default','Default Test Organization'],
            ['org_corp','Corporate Test Organization'],
            ['org_test','Test Organization'],
            ['org_onboarding_test_99','Onboarding Test Organization 99'],
            ['org_hardened_test_01','Hardened Test Organization 01'],
            ['org_sec','Security Test Organization'],
            ['org_csrf','CSRF Test Organization'],
            ['org_empty_prereq_99','Empty Prerequisite Test Organization'],
            ['org_cross','Cross Instance Test Organization'],
            ['org_rotate','Rotate Test Organization']
          ];
          for (const [id,email] of users) {
            await client.query(
              'INSERT INTO users (id,email,name) VALUES ($1,$2,$1) ON CONFLICT (id) DO NOTHING',
              [id,email]
            );
          }
          for (const [id,name] of orgs) {
            await client.query(
              'INSERT INTO organizations (id,name) VALUES ($1,$2) ON CONFLICT (id) DO NOTHING',
              [id,name]
            );
          }
          await client.end();
          console.log('Deterministic PostgreSQL test principals seeded');
          NODE

      - name: Run Vitest
        run: npx vitest run

      - name: Run complete recorded test suite
        run: npm run test:record

      - name: Verify production image builds
        run: docker build --tag compflow-ci:latest .
