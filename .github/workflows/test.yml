name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Full tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compflow
          POSTGRES_PASSWORD: compflow
          POSTGRES_DB: compflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compflow -d compflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://compflow:compflow@localhost:5432/compflow_test
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify infrastructure
        run: |
          node -e "const net=require('net'); const c=net.createConnection(6379,'127.0.0.1'); c.on('connect',()=>{console.log('Redis reachable');c.destroy()}); c.on('error',e=>{console.error(e);process.exit(1)})"
          node -e "const net=require('net'); const c=net.createConnection(5432,'127.0.0.1'); c.on('connect',()=>{console.log('PostgreSQL reachable');c.destroy()}); c.on('error',e=>{console.error(e);process.exit(1)})"

      - name: Run recorded test suite
        run: npm run test:record

      - name: Run Vitest explicitly
        run: npx vitest run
