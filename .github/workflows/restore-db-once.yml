name: Restore DB module once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor == 'Udene1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact known-good DB adapter
        run: |
          set -euo pipefail
          git fetch origin c3bb9e21fd3336cef7d7fa2363957308855dfc87 --no-tags
          git checkout c3bb9e21fd3336cef7d7fa2363957308855dfc87 -- core/db.js
          rm -f .github/workflows/restore-db-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/db.js .github/workflows/restore-db-once.yml
          git commit -m 'fix(db): restore full database adapter'
          git push origin HEAD:main
