name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AZURE_VM_HOST: 20.245.136.231
  AZURE_VM_USER: azureuser
  AZURE_APP_DIR: /home/azureuser/Compflow

jobs:
  deploy:
    name: Deploy Compflow to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Azure deployment configuration
        env:
          AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$AZURE_SSH_PRIVATE_KEY" || {
            echo "AZURE_SSH_PRIVATE_KEY GitHub secret is not configured."
            exit 1
          }

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}

      - name: Trust Azure VM host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$AZURE_VM_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Azure VM access
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$AZURE_VM_USER@$AZURE_VM_HOST" 'set -e; echo "Azure VM SSH access OK"; docker --version; docker compose version'

      - name: Validate authoritative application directory
        run: |
          set -euo pipefail
          ssh "$AZURE_VM_USER@$AZURE_VM_HOST" "set -euo pipefail
            APP_DIR='$AZURE_APP_DIR'
            test -d \"\$APP_DIR\" || { echo \"Missing application directory: \$APP_DIR\"; exit 1; }
            test -f \"\$APP_DIR/docker-compose.yml\" || {
              echo \"Missing docker-compose.yml in \$APP_DIR\"
              echo 'Directory contents:'
              ls -la \"\$APP_DIR\"
              echo 'Compose candidates:'
              find \"\$APP_DIR\" -maxdepth 1 -type f -iname '*compose*.y*ml' -print
              exit 1
            }
            git -C \"\$APP_DIR\" rev-parse --is-inside-work-tree
            echo \"Authoritative application directory: \$APP_DIR\"
          "

      - name: Pull latest code and rebuild production stack
        run: |
          set -euo pipefail
          ssh "$AZURE_VM_USER@$AZURE_VM_HOST" "set -euo pipefail
            cd '$AZURE_APP_DIR'
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo 'Deployed commit:'
            git rev-parse HEAD
            sudo docker compose config >/dev/null
            sudo docker compose up --build -d
          "

      - name: Verify production containers
        run: |
          set -euo pipefail
          ssh "$AZURE_VM_USER@$AZURE_VM_HOST" "set -euo pipefail
            cd '$AZURE_APP_DIR'
            sudo docker compose ps
            test \"\$(sudo docker inspect -f '{{.State.Running}}' compflow-app)\" = true
            test \"\$(sudo docker inspect -f '{{.State.Running}}' compflow-redis)\" = true
            test \"\$(sudo docker inspect -f '{{.State.Running}}' compflow-postgres)\" = true
          "

      - name: Verify application health with retry
        run: |
          set -euo pipefail
          ssh "$AZURE_VM_USER@$AZURE_VM_HOST" 'set -euo pipefail
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/health; then
                echo
                echo "Compflow health check passed on attempt $attempt"
                exit 0
              fi
              echo "Health check attempt $attempt failed; waiting 5s..."
              sleep 5
            done
            echo "Compflow health check failed after 6 attempts"
            sudo docker compose logs --tail=100 compflow-app
            exit 1
          '
