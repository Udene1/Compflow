name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AZURE_VM_HOST: 20.245.136.231
  AZURE_VM_USER: azureuser
  AZURE_APP_DIR: /home/azureuser/Compflow

jobs:
  deploy:
    name: Deploy Compflow to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Azure deployment configuration
        env:
          AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$AZURE_SSH_PRIVATE_KEY" || {
            echo "AZURE_SSH_PRIVATE_KEY GitHub secret is not configured."
            exit 1
          }

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}

      - name: Trust Azure VM host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$AZURE_VM_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Azure VM access
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$AZURE_VM_USER@$AZURE_VM_HOST" 'set -e; echo "Azure VM SSH access OK"; docker --version; docker compose version'

      - name: Pull latest code and rebuild production stack
        run: |
          set -euo pipefail
          ssh "$AZURE_VM_USER@$AZURE_VM_HOST" "set -euo pipefail
            cd '$AZURE_APP_DIR'
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            sudo docker compose up --build -d
          "

      - name: Verify production containers
        run: |
          set -euo pipefail
          ssh "$AZURE_VM_USER@$AZURE_VM_HOST" "set -euo pipefail
            cd '$AZURE_APP_DIR'
            sudo docker compose ps
            test \"\$(sudo docker inspect -f '{{.State.Running}}' compflow-app)\" = true
            test \"\$(sudo docker inspect -f '{{.State.Running}}' compflow-redis)\" = true
            test \"\$(sudo docker inspect -f '{{.State.Running}}' compflow-postgres)\" = true
          "

      - name: Verify application health
        run: |
          set -euo pipefail
          ssh "$AZURE_VM_USER@$AZURE_VM_HOST" "set -euo pipefail
            curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/health >/dev/null
          "
